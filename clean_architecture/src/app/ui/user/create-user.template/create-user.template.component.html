<app-header></app-header>

<div class="container">
    <h2>Formulario de Registro</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" class="form-control" [(ngModel)]="user.name" name="nombre" required>
      </div>
  
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" class="form-control" [(ngModel)]="user.email" name="email" required>
      </div>
  
      <button type="submit" class="btn btn-primary" [disabled]="!user.name || !user.email">Registrar</button>
    </form>
  </div>
